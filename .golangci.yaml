version: "2"
run:
  build-tags:
    - test_performance
  tests: true
  timeout: 5m
linters:
  enable:
    - asciicheck
    - bidichk
    - copyloopvar
    - depguard
    - errorlint
    - forbidigo
    - ginkgolinter
    - gocritic
    - gocyclo
    - goheader
    - gosec
    - kubeapilinter
    - misspell
    - modernize
    - nilerr
    - noctx
    - prealloc
    - revive
    - staticcheck
    - tparallel
    - unconvert
    - unparam
  settings:
    custom:
      kubeapilinter:
        type: "module"
        description: Kube API Linter lints Kube like APIs based on API conventions and best practices.
        settings:
          linters: {}
          lintersConfig: {}
    # One owner for helpers that keep getting re-implemented (review on #3028, #2894,
    # #3015, #3407). #2968 replaced retry-go with k8s wait.
    depguard:
      rules:
        resources:
          files:
            - $all
            - "!**/pkg/utils/resources/*.go"
          deny:
            - pkg: k8s.io/component-helpers/resource
              desc: use sigs.k8s.io/karpenter/pkg/utils/resources
        retry:
          deny:
            - pkg: github.com/avast/retry-go
              desc: use k8s.io/apimachinery/pkg/util/wait
    # Use the injected clock in production code: #3009, #3045, #3406, #3038.
    # Background deletion in e2e helpers: #3316.
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^time\.(Now|Since|Until)$
          pkg: ^time$
          msg: use the injected clock.Clock
        - pattern: ^clock\.RealClock$
          pkg: ^k8s\.io/utils/clock$
          msg: use the injected clock.Clock
        - pattern: ^v1\.DeletePropagationForeground$
          pkg: ^k8s\.io/apimachinery/pkg/apis/meta/v1$
          msg: use background deletion in e2e helpers
    # Expect(x) and Eventually(f) without a matcher pass silently, e.g. the drift
    # check in test/suites/disruption/drift_test.go and Expect(c.Delete(...)) in
    # the pkg/test expectations helper. Also forbids focused specs left in.
    ginkgolinter:
      suppress-len-assertion: true
      suppress-nil-assertion: true
      suppress-err-assertion: true
      suppress-compare-assertion: true
      suppress-async-assertion: true
      suppress-type-compare-assertion: true
      forbid-focus-container: true
      allow-havelen-zero: true
    # Large per-iteration copies in scheduling and cluster state hot paths (#3211, #3310).
    gocritic:
      disable-all: true
      enabled-checks:
        - rangeValCopy
    gocyclo:
      min-complexity: 30
    goheader:
      template: |-
        Copyright The Kubernetes Authors.

        Licensed under the Apache License, Version 2.0 (the "License");
        you may not use this file except in compliance with the License.
        You may obtain a copy of the License at

            http://www.apache.org/licenses/LICENSE-2.0

        Unless required by applicable law or agreed to in writing, software
        distributed under the License is distributed on an "AS IS" BASIS,
        WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.
        See the License for the specific language governing permissions and
        limitations under the License.
    govet:
      disable:
        - fieldalignment
      enable-all: true
    misspell:
      locale: US
    # Keeps `go fix ./...` from #3024 from drifting back (lo.ToPtr/ptr.To went 1110 -> 91 -> 641).
    modernize: {}
    # Allocation regressions in hot paths: #3211, #3310, #3068, #3137.
    prealloc:
      simple: true
      range-loops: true
    revive:
      rules:
        - name: dot-imports
          disabled: true
    staticcheck:
      dot-import-whitelist:
        - github.com/onsi/ginkgo/v2
        - github.com/onsi/gomega
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - goheader
        path: zz_(.+)\.go
      - linters:
          - prealloc
        path: (_test\.go$|^pkg/test/|^test/)
      - linters:
          - goheader
        path: scheduling_benchmark_test.go
      - path: (.+)\.go$
        text: declaration of "(err|ctx)" shadows declaration at
      - path-except: pkg/apis/
        linters:
          - kubeapilinter
      - path: (_test\.go$|^test/|^pkg/test/|^pkg/operator/)
        linters:
          - forbidigo
        text: use the injected clock
      - path-except: ^test/
        linters:
          - forbidigo
        text: use background deletion
      - path-except: pkg/(scheduling|controllers/provisioning/scheduling|controllers/state)/
        linters:
          - gocritic
      - path: _test\.go$
        linters:
          - gocritic
    paths:
      - tools
      - website
      - hack
      - charts
      - designs
      - third_party$
      - builtin$
      - examples$
issues:
  fix: true
  fix-by-linter:
    - kubeapilinter: false
formatters:
  enable:
    - goimports
  settings:
    gci:
      sections:
        - standard
        - default
        - localmodule
    goimports:
      local-prefixes:
        - sigs.k8s.io/karpenter
  exclusions:
    generated: lax
    paths:
      - tools
      - website
      - hack
      - charts
      - designs
      - third_party$
      - builtin$
      - examples$
