name: ApprovalComment
on:
  pull_request_review:
    types: [submitted]
permissions:
  contents: read
jobs:
  approval-comment:
    # The association test is what makes this workflow's name true. Downstream
    # workflows key off this run and now check out the commit it records, so
    # without the test any PR author could have their own branch built and
    # executed by a privileged workflow_run job. There is no association test in
    # the review body check itself: startsWith matches whoever submits the
    # review. aws/karpenter-provider-aws gates the same trigger on org
    # membership through an API call; author_association carries that answer in
    # the event payload with no extra action dependency.
    if: |
      startsWith(github.event.review.body, '/karpenter perf') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.review.author_association)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Save info about the review comment as an artifact for other workflows that run on workflow_run to download them
        env:
          REVIEW_BODY: ${{ github.event.review.body }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
          COMMIT_ID: ${{ github.event.review.commit_id }}
        run: |
          mkdir -p /tmp/artifacts
          { echo "$REVIEW_BODY"; echo "$PULL_REQUEST_NUMBER"; echo "$COMMIT_ID"; } >> /tmp/artifacts/metadata.txt
          cat /tmp/artifacts/metadata.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifacts
          path: /tmp/artifacts
