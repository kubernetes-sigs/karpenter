name: "Scheduling Benchmarking"

on:
  pull_request:
    paths:
      - "**.go"
    branches:
      - main

# A new push to a pull request cancels that pull request's in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve Baseline
    runs-on: ubuntu-latest
    outputs:
      before: ${{ steps.firstparent.outputs.before }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - id: firstparent
        shell: bash
        run: |
          set -euo pipefail
          if ! git rev-parse --verify --quiet "HEAD^2" >/dev/null; then
            echo "::error::${{ github.sha }} is not a merge commit, so the pre-PR baseline cannot be derived"
            exit 1
          fi
          echo "before=$(git rev-parse HEAD^1)" >> "$GITHUB_OUTPUT"
  compare:
    name: Compare ${{ matrix.leg }}
    needs: [resolve]
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeoutMinutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # compare.sh interleaves both arms of a leg inside this one job, so
          # timeoutMinutes is a ceiling on base plus head, not on one arm.
          # Measured on ubuntu-latest at -bench=. -benchtime=1x -count=6, one
          # arm, one package: the scheduling leg took 16m22s and the disruption
          # leg 37m40s. At -count=4 those come to roughly 12 and 26, so two arms
          # come to 24 and 52. The ceilings below add about 25 percent, which
          # covers a slower runner and the package level sync.Once setup that
          # each of the two -count=2 processes per arm pays. COUNT stays at 4
          # because benchstat's Mann-Whitney U test cannot report below p=0.029
          # with four samples a side, which is why MAX_P is 0.05 here rather
          # than compare.sh's 0.01: at this sample count 0.01 would leave the
          # gate unable to fire at any effect size. go test -timeout cannot
          # supply the ceiling, because testing.M.Run stops its alarm before
          # runBenchmarks and -run='^$' leaves no test holding it open, so
          # without timeout-minutes the only bound is GitHub's 360 minute
          # default.
          - leg: scheduling
            pkg: ./pkg/controllers/provisioning/scheduling
            timeoutMinutes: 30
          - leg: consolidation
            pkg: ./pkg/controllers/disruption
            timeoutMinutes: 65
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: ./.github/actions/install-deps
      - name: Install benchstat
        run: go install golang.org/x/perf/cmd/benchstat@v0.0.0-20261009192801-be2c69fb417e
      - name: Compare base and head
        shell: bash
        env:
          BEFORE: ${{ needs.resolve.outputs.before }}
          PKG: ${{ matrix.pkg }}
          COUNT: "4"
          BENCHTIME: "1x"
          MAX_P: "0.05"
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          hack/bench/compare.sh "$BEFORE" HEAD "$PKG" | tee -a "$GITHUB_STEP_SUMMARY"
