name: "Scheduling Benchmarking"

on:
  pull_request:
    paths:
      - "**.go"
    branches:
      - main

# A new push to a pull request cancels that pull request's in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  before:
    name: Before PR
    strategy:
      fail-fast: false
      matrix:
        path: ["pkg/controllers/provisioning/scheduling"]
    uses: ./.github/workflows/run-bench-test.yaml
    secrets: inherit
    with:
      path: ${{ matrix.path }}
      runName: before-${{ strategy.job-index }}
      githubSha: ${{ github.event.pull_request.base.sha }}
  after:
    name: After PR
    permissions:
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        path: ["pkg/controllers/provisioning/scheduling"]
    uses: ./.github/workflows/run-bench-test.yaml
    secrets: inherit
    with:
      path: ${{ matrix.path }}
      runName: after-${{ strategy.job-index }}  
      githubSha: ${{ github.sha }}