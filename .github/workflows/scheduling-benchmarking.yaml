name: "Scheduling Benchmarking"

on:
  pull_request:
    paths:
      - "**.go"
    branches:
      - main

# A new push to a pull request cancels that pull request's in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: ./.github/actions/install-deps
      - name: Install benchstat
        run: go install golang.org/x/perf/cmd/benchstat@v0.0.0-20261009192801-be2c69fb417e
      - name: Compare base and head
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BENCH: "BenchmarkScheduling(100|1000)$|BenchmarkNewScheduler|BenchmarkNewTopology|BenchmarkForEachDomain|BenchmarkStoreApply|BenchmarkRepair|BenchmarkClusterUpdateNode"
        run: |
          hack/bench/compare.sh "$BASE_SHA" HEAD | tee "$GITHUB_STEP_SUMMARY"
