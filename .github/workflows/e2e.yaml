name: e2e
on:
  workflow_call:
    inputs:
      k8s_version:
        type: string
        default: "1.36"
      suite:
        type: string
        required: true
      focus:
        type: string
        required: false
        description: "Ginkgo focus pattern to run specific tests"
      test_name:
        type: string
        required: false
        description: "Human-readable test name for job identification"
      perf_env:
        type: string
        required: false
        description: "KEY=VALUE lines exported to the test, e.g. KARPENTER_PERF_PROVIDER=kwok-ci"
      regression:
        type: string
        required: false
        description: "Patch in test/suites/performancev2/perf/regressions to apply before building"
      plot:
        type: boolean
        default: false
        description: "Render the performance reports as perf.html"
      retention_days:
        type: number
        default: 30
jobs:
  e2e:
    permissions:
      issues: write
    runs-on: ubuntu-latest
    name: ${{ inputs.test_name || format('suite-{0}', inputs.suite) }}
    steps:
    - name: Debug workflow_run trigger
      run: |
        echo "Event name: ${{ github.event_name }}"
        echo "Workflow run conclusion: ${{ github.event.workflow_run.conclusion }}"
        echo "Workflow run name: ${{ github.event.workflow_run.name }}"
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
    - name: apply regression ${{ inputs.regression }}
      if: inputs.regression != ''
      env:
        REGRESSION: ${{ inputs.regression }}
      run: git apply "test/suites/performancev2/perf/regressions/${REGRESSION}.patch"
    - name: Set up Python 3.10
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: "3.10"
    - uses: ./.github/actions/install-deps
      with:
          k8sVersion: ${{ inputs.k8s_version }}
    - name: Kind Cluster
      uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
      with:
        # Configures the cluster's kube-scheduler with the default topology spread constraints the
        # DefaultTopologySpreadConstraints specs mirror into Karpenter. Everything else is a default cluster.
        config: hack/kind/cluster.yaml
    - name: check kind cluster and taint nodes
      shell: bash
      run: |
        kubectl config current-context
        kubectl get nodes
        kubectl taint nodes chart-testing-control-plane CriticalAddonsOnly:NoSchedule
    - name: install prometheus 
      uses: ./.github/actions/install-prometheus
    - name: install pyroscope 
      uses: ./.github/actions/install-pyroscope
    - name: install ko
      shell: bash
      run: |
        go install github.com/google/ko@latest      
    - name: install kwok and controller
      shell: bash
      run: |
        make install-kwok
        export KWOK_REPO=kind.local
        export KIND_CLUSTER_NAME=chart-testing
        make apply-with-kind
    - name: ping cluster
      shell: bash
      run: | 
        sleep 15
        kubectl get pods -n kube-system | grep karpenter 
        kubectl get nodepools
        kubectl get pods -A
        kubectl describe nodes
    - name: run the ${{ inputs.test_name || inputs.suite }} test
      env:
          SUITE: ${{ inputs.suite }}
          FOCUS: ${{ inputs.focus }}
          PERF_ENV: ${{ inputs.perf_env }}
      shell: bash
      run: |
        OUTPUT_DIR=$(mktemp -d)
        export OUTPUT_DIR
        echo OUTPUT_DIR="$OUTPUT_DIR" >> "$GITHUB_ENV"
        while IFS= read -r kv; do [ -n "$kv" ] && export "${kv?}"; done <<< "$PERF_ENV"
        TEST_SUITE="$SUITE" make e2etests
    - name: plot performance results
      if: always() && inputs.plot && env.OUTPUT_DIR != ''
      shell: bash
      run: |
        make perf-plot DIR="$OUTPUT_DIR"
        mv perf.html "$OUTPUT_DIR/"
    - name: Upload performance results
      if: always() && env.OUTPUT_DIR != ''
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: performance-results-${{ inputs.test_name || format('suite-{0}', inputs.suite) }}-${{ github.run_id }}
        path: |
          ${{ env.OUTPUT_DIR }}/*_performance_report.json
          ${{ env.OUTPUT_DIR }}/karpenter_memory_profile_*.pb.gz
          ${{ env.OUTPUT_DIR }}/karpenter_cpu_profile_*.pb.gz
          ${{ env.OUTPUT_DIR }}/perf.html
        retention-days: ${{ inputs.retention_days }}
        if-no-files-found: ignore
    - name: cleanup 
      shell: bash
      run: | 
        kubectl delete nodepools --all 
        make delete
        make uninstall-kwok
