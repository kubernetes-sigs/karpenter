name: presubmit
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# A new push to a pull request cancels that pull request's in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  presubmit:
    permissions:
      issues: write
    runs-on: ubuntu-latest
    # Passing legs take up to about 25 minutes. A leg with a hung test ran about 31 minutes
    # before the 20m go test timeout failed it, so 45 still lets go test print its stack dump.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        k8sVersion: ["1.30.x", "1.31.x", "1.32.x", "1.33.x", "1.34.x", "1.35.x", "1.36.x"]
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
    - uses: ./.github/actions/install-deps
      with:
        k8sVersion: ${{ matrix.k8sVersion }}
    - name: Enable the actionlint matcher
      run: echo "::add-matcher::.github/actionlint-matcher.json"
    - run: K8S_VERSION=${{ matrix.k8sVersion }} make presubmit
    - name: Send coverage
      # should only send converage once https://docs.coveralls.io/parallel-builds
      if: matrix.k8sVersion == '1.36.x'
      env:
        COVERALLS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: go tool -modfile=go.tools.mod goveralls -coverprofile=coverage.out -service=github
  presubmit-result:
    # One check name that does not change when the k8s version matrix changes.
    # always() makes this job report failure instead of skipped when a leg fails or is cancelled.
    if: always()
    needs: [presubmit]
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - env:
        RESULT: ${{ needs.presubmit.result }}
      run: |
        echo "presubmit result: ${RESULT}"
        test "${RESULT}" = success
