name: vulncheck
# New entries in the Go vulnerability database can fail vulncheck without any code change.
# This daily run catches them on main between pushes.
on:
  schedule:
  - cron: '17 6 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  vulncheck:
    if: github.event_name != 'schedule' || github.repository == 'kubernetes-sigs/karpenter'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
    - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
      with:
        go-version-file: go.mod
        check-latest: true
        cache: false
    - run: make vulncheck
