---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: nodeclaims.karpenter.sh
spec:
  group: karpenter.sh
  names:
    kind: NodeClaim
    listKind: NodeClaimList
    plural: nodeclaims
    singular: nodeclaim
  scope: Cluster
  versions:
    - name: v1
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                requirements:
                  type: array
                  maxItems: 100
                  items:
                    type: object
                    properties:
                      key:
                        type: string
                        maxLength: 316
                        x-kubernetes-validations:
                          - message: label "stale.example.com/key" is restricted on NodeClaim
                            rule: self != "stale.example.com/key"
                          - message: key must not be empty
                            rule: self != ""
                      operator:
                        type: string
                    required:
                      - key
                      - operator
      served: true
      storage: true
