---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: nodepools.karpenter.sh
spec:
  group: karpenter.sh
  names:
    kind: NodePool
    listKind: NodePoolList
    plural: nodepools
    singular: nodepool
  scope: Cluster
  versions:
    - name: v1
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                template:
                  type: object
                  properties:
                    metadata:
                      type: object
                      properties:
                        labels:
                          type: object
                          additionalProperties:
                            type: string
                            maxLength: 63
                          maxProperties: 100
                          x-kubernetes-validations:
                            - message: label domain "stale.example.com" is restricted
                              rule: self.all(x, !x.startsWith("stale.example.com/"))
                    spec:
                      type: object
                      properties:
                        requirements:
                          type: array
                          maxItems: 100
                          items:
                            type: object
                            properties:
                              key:
                                type: string
                                maxLength: 316
                              operator:
                                type: string
                            required:
                              - key
                              - operator
      served: true
      storage: true
