---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: nodeclaims.karpenter.sh
spec:
  group: karpenter.sh
  names:
    kind: NodeClaim
    listKind: NodeClaimList
    plural: nodeclaims
    singular: nodeclaim
  scope: Cluster
  versions:
    - name: v1
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                requirements:
                  type: array
                  maxItems: 100
                  items:
                    type: object
                    properties:
                      key:
                        type: string
                        maxLength: 316
                        x-kubernetes-validations:
                          - message: key must not be empty
                            rule: self != ""
                          - message: label domain "restricted.example.com" is restricted
                            rule: '!self.contains("/") || self in ["restricted.example.com/alias", "restricted.example.com/allowed", "restricted.example.com/not-on-nodepool"] || !(self.find("^([^/]+)") == "restricted.example.com" || self.find("^([^/]+)").endsWith(".restricted.example.com"))'
                          - message: label "example.com/restricted" is restricted on NodeClaim
                            rule: self != "example.com/restricted"
                      operator:
                        type: string
                    required:
                      - key
                      - operator
      served: true
      storage: true
